<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIRAGE — Linux</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #0a0e12; --panel: #0f1620; --ink: #9fb4c4; --accent: #00d0a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px ui-monospace, "SF Mono", Menlo, monospace;
         display: flex; flex-direction: column; height: 100vh; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid #1c2a36; }
  #bar .logo { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  #stage { flex: 1; position: relative; min-height: 0; margin: 8px; }
  /* Absolute and contained, so a short window letterboxes the picture instead of cutting its bottom. */
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; image-rendering: pixelated; outline: none; }
  #out { margin: 0; height: 7.5em; overflow: auto; white-space: pre-wrap; color: #cfe3d8; background: #05080b;
         padding: 6px 12px; border-top: 1px solid #1c2a36; }
  #status { padding: 4px 12px; background: var(--panel); border-top: 1px solid #1c2a36; }
  a.logo { text-decoration: none; color: inherit; } a.logo:hover { filter: brightness(1.25); }
</style>
</head>
<body>
  <header id="bar"><a class="logo" href="./" title="MIRAGE — home">▚ MIRAGE · Linux</a><span id="title"></span></header>
  <main id="stage"><canvas id="screen" width="640" height="400" tabindex="0"></canvas></main>
  <pre id="out"></pre>
  <div id="status">loading…</div>
<script type="module">
// The browser side of `oasis run <linux image>` (tools/oasis.mjs serves it): src/linuxrun.js does the work.
import { startLinux, oasisHost } from './src/linuxrun.js';
const out = document.getElementById('out'), status = document.getElementById('status');
// Served by anything else (a static host), there is no image to run here: the Linux machine says why.
const img = await fetch('/oasis-image.json').then((r) => r.json()).catch(() => null);
if (!img) { location.replace('machines.html?m=linux'); await new Promise(() => {}); }
document.title = img.title || img.name; document.getElementById('title').textContent = img.title || img.name;
let text = '';
try {
  window.mirage = await startLinux({ canvas: document.getElementById('screen'), img, host: oasisHost(null),
    onOutput: (t) => { text = (text + t).slice(-20000); out.textContent = text; out.scrollTop = out.scrollHeight; },
    onStatus: (t) => { status.textContent = t; } });
  document.getElementById('screen').focus();
} catch (e) { status.textContent = String(e.message || e); }
</script>
</body>
</html>
