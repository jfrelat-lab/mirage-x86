<!--
  The release notes, read from CHANGELOG.md beside this page: one file, the one GitHub shows too.
  The converter below knows only what that file uses -- headings, list items (nested by two spaces),
  paragraphs, **bold**, *italic*, `code` and [links](url) -- and escapes everything else.
-->
<link rel="stylesheet" href="site.css">
<style>
  :root { --bg: #0a0e12; --panel: #0f1620; --edge: #1f2c38; --ink: #c6d4de; --dim: #6f8494; --head: #e6f0f6; --accent: #00d0a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code { font: .88em ui-monospace, "SF Mono", Menlo, monospace; padding: 1px 5px; border: 1px solid var(--edge);
         border-radius: 4px; background: var(--panel); overflow-wrap: anywhere; }
  b { color: var(--head); font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 56px; }
  h1 { margin: 40px 0 10px; font: 700 clamp(26px, 3.6vw, 34px)/1.15 ui-monospace, "SF Mono", Menlo, monospace; color: var(--head); }
  h2 { margin: 40px 0 8px; padding-top: 14px; border-top: 1px solid var(--edge); font: 600 17px ui-monospace, "SF Mono", Menlo, monospace;
       color: var(--accent); font-variant-numeric: tabular-nums; }
  h3 { margin: 22px 0 6px; font-size: 16px; color: var(--head); }
  #notes > p:first-of-type { color: var(--dim); }
  ul { margin: 8px 0; padding-left: 22px; } li { margin: 6px 0; } li ul { margin: 4px 0; }
  .err { color: var(--dim); }
  footer { border-top: 1px solid var(--edge); padding: 18px 16px; color: var(--dim); font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <header class="site">
    <a class="logo" href="./" title="MIRAGE — home">▚ MIRAGE<small>x86 → JavaScript</small></a>
    <nav class="site" aria-label="Site"><a href="machines.html">Machines</a><a href="oasis.html">OASIS</a><a href="dos.html">DOS player</a><a href="boot.html">Bare PC</a><a href="changes.html" aria-current="page">What's new</a><a href="https://github.com/jfrelat-lab/mirage-x86/tree/main/docs">Docs</a><a href="https://github.com/jfrelat-lab/mirage-x86">Source</a><a class="star" href="https://github.com/jfrelat-lab/mirage-x86" title="MIRAGE on GitHub: a star helps others find it">★ Star on GitHub</a></nav>
  </header>

  <main>
    <div id="notes"><p class="err">Loading the release notes…</p></div>
  </main>

  <footer>MIRAGE is free software under the <a href="https://github.com/jfrelat-lab/mirage-x86/blob/main/LICENSE">MIT licence</a>.
    These notes are <a href="https://github.com/jfrelat-lab/mirage-x86/blob/main/CHANGELOG.md">CHANGELOG.md</a> in the repository.</footer>

<script>
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Inline marks, on text already escaped: code first, so nothing inside it is read as a mark.
  function inline(text) {
    const codes = [];
    let s = esc(text).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${u}">${t}</a>`)
         .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
         .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?=[^*\w]|$)/g, '$1<i>$2</i>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
  }
  // Blocks: headings, paragraphs, and list items whose continuation lines and nested items are indented.
  function render(md) {
    const out = [], lines = md.replace(/\r/g, '').split('\n');
    let para = [], stack = [];             // open lists, by indentation
    const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
    const closeTo = (depth) => { while (stack.length > depth) { out.push('</li></ul>'); stack.pop(); } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const h = /^(#{1,3})\s+(.*)$/.exec(line);
      const li = /^(\s*)-\s+(.*)$/.exec(line);
      if (h) { flushPara(); closeTo(0); const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
      if (li) {
        flushPara();
        const depth = li[1].length / 2 + 1;
        let text = li[2];
        while (i + 1 < lines.length && /^\s+\S/.test(lines[i + 1]) && !/^\s*-\s/.test(lines[i + 1])) text += ' ' + lines[++i].trim();
        if (depth > stack.length) { out.push('<ul><li>'); stack.push(depth); }
        else { closeTo(depth); out.push('</li><li>'); }
        out.push(inline(text));
        continue;
      }
      if (!line.trim()) { flushPara(); if (!/^\s*-\s/.test(lines[i + 1] ?? '')) closeTo(0); continue; }
      closeTo(0);
      para.push(line.trim());
    }
    flushPara(); closeTo(0);
    return out.join('\n');
  }
  fetch('CHANGELOG.md', { cache: 'no-cache' }).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.text();
  }).then((md) => { document.getElementById('notes').innerHTML = render(md); })
    .catch((e) => {
      document.getElementById('notes').innerHTML =
        `<p class="err">The release notes could not be loaded (${esc(e.message)}). They are also on ` +
        `<a href="https://github.com/jfrelat-lab/mirage-x86/blob/main/CHANGELOG.md">GitHub</a>.</p>`;
    });
</script>
</body>
</html>
